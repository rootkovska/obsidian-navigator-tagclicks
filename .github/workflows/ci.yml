name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    # Runs the real Obsidian desktop app (and its mobile UI emulation) with the real Notebook Navigator.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ hashFiles('package-lock.json') }}
      - name: e2e (${{ matrix.mode }})
        run: xvfb-run -a npm run ${{ matrix.mode == 'mobile' && 'test:e2e:mobile' || 'test:e2e' }}
